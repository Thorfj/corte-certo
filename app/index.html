<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Barbozap</title>
  <link rel="stylesheet" href="/app/css/global.css">
  <link rel="stylesheet" href="/app/css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app/js/supabase-config.js"></script>
</head>

<body>
  <div class="card login-card">
    <div class="login-logo">
      <div class="logo-icon">BZ</div>
      <span>Barbozap</span>
    </div>

    <div id="login-google">
      <button type="button" class="btn-google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Entrar com Google
      </button>
      <p class="login-error" id="google-error"></p>
      <div class="login-divisor"><span>ou</span></div>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary login-btn" id="login-btn">Entrar</button>
      <p class="login-error" id="login-error"></p>
      <button type="button" class="login-link" id="link-esqueci">Esqueci minha senha</button>
      <p class="login-cadastro">Ainda não tem conta? <a href="/teste-gratis/">Teste grátis por 14 dias</a></p>
    </form>

    <!-- Recuperação de senha: manda o link por e-mail -->
    <form id="esqueci-form" hidden>
      <p class="login-texto">Digite o e-mail da sua conta. Vamos te mandar um link para criar uma senha nova.</p>
      <div class="field">
        <label for="email-recuperar">E-mail</label>
        <input type="email" id="email-recuperar" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary login-btn" id="recuperar-btn">Enviar link</button>
      <p class="login-error" id="recuperar-error"></p>
      <p class="login-ok" id="recuperar-ok"></p>
      <button type="button" class="login-link" id="link-voltar">← Voltar para o login</button>
    </form>
  </div>
  <script src="/app/js/login.js"></script>
</body>

</html>
