<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimentos — Corte Certo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/atendimentos.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon"><i data-lucide="scissors" style="width:18px;height:18px"></i></div>
        <span class="logo-name"></span>
      </div>
      <nav class="nav">
        <a class="nav-item active" href="atendimentos.html"><i data-lucide="clipboard-list"></i> Atendimentos</a>
        <a class="nav-item" href="agenda.html"><i data-lucide="calendar"></i> Agenda</a>
        <a class="nav-item" href="contatos.html"><i data-lucide="users"></i> Contatos</a>
        <a class="nav-item" href="servicos.html"><i data-lucide="scissors"></i> Serviços</a>
        <a class="nav-item" href="mensagens.html"><i data-lucide="message-square"></i> Mensagens</a>
        <a class="nav-item" href="relatorios.html"><i data-lucide="pie-chart"></i> Relatórios</a>
        <a class="nav-item" href="configuracoes.html"><i data-lucide="settings"></i> Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <button class="help-button"><i data-lucide="help-circle" style="width:16px;height:16px"></i></button>
        <a class="nav-item" href="#" id="logout-link"><i data-lucide="log-out"></i> Sair</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title" style="margin:0">Atendimentos</h1>
        <button class="btn btn-primary" id="novo-atendimento-btn">
          <i data-lucide="plus" style="width:16px;height:16px"></i> Novo atendimento
        </button>
      </div>

      <div class="toolbar">
        <div class="field-inline">
          <label for="filtro-inicio">De</label>
          <input type="date" id="filtro-inicio">
        </div>
        <div class="field-inline">
          <label for="filtro-fim">Até</label>
          <input type="date" id="filtro-fim">
        </div>
        <button class="btn" id="filtrar-btn">Filtrar</button>
        <button class="btn" id="limpar-filtro-btn">Limpar</button>
      </div>

      <div class="metrics-grid" id="metrics-grid"></div>

      <div id="kanban" class="kanban">
        <div class="loading">Carregando atendimentos...</div>
      </div>
    </main>
  </div>

  <script src="../js/atendimentos.js"></script>
</body>

</html>
